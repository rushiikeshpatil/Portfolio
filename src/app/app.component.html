<div class="min-vh-100 d-flex flex-column">
  <main [@routeTransition]="prepareRoute(outlet)" class="flex-grow-1">
    <router-outlet #outlet="outlet"></router-outlet>
  </main>

  <!-- Bottom sticky nav -->
  <nav class="bottom-nav card-glass mx-3 my-2 rounded-pill">
    <div class="d-flex justify-content-around align-items-center">
      <a routerLink="/home" routerLinkActive="active" class="nav-link text-center">
        <i class="bi bi-house-fill fs-5 d-block"></i>
        <small>Home</small>
      </a>
      <a routerLink="/about" routerLinkActive="active" class="nav-link text-center">
        <i class="bi bi-person-fill fs-5 d-block"></i>
        <small>About</small>
      </a>
      <a routerLink="/experience" routerLinkActive="active" class="nav-link text-center">
        <i class="bi bi-tools fs-5 d-block"></i>
        <small>Experience</small>
      </a>
      <a routerLink="/projects" routerLinkActive="active" class="nav-link text-center">
        <i class="bi bi-briefcase-fill fs-5 d-block"></i>
        <small>Work</small>
      </a>
      <a routerLink="/contact" routerLinkActive="active" class="nav-link text-center">
        <i class="bi bi-envelope-fill fs-5 d-block"></i>
        <small>Contact</small>
      </a>
    </div>
  </nav>
</div>
