<section class="container container-hero">
    <h3>Selected Work</h3>
    <div class="row mt-3 g-3">
        <div class="col-md-6" *ngFor="let p of projects">
            <div class="card-glass p-4 h-100">
                <h5>{{ p.title }}</h5>
                <small class="text-muted-soft">{{ p.subtitle }}</small>
                <ul class="mt-3 text-muted-soft">
                    <li *ngFor="let pt of p.points">{{ pt }}</li>
                </ul>
            </div>
        </div>
    </div>
</section>
