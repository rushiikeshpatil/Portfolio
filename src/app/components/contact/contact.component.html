<section class="container container-hero">
    <h3>Contact Me</h3>
    <div class="row mt-3">
        <div class="col-md-6">
            <div class="card-glass p-4">
                <h4>Let's build something together</h4>
                <p class="text-muted-soft">Open to new roles and collaborations. I reply quickly — let’s talk about how
                    I can help your team ship better software.</p>
                <p>Phone Number: +91 70391 52130</p>
                <hr>
                <div class="mt-3 text-end">
                    <a href="mailto:rushikesh2310patil@gmail.com" class="btn btn-outline-light mx-1">Email Me</a>
                    <a href="assets/Rushikesh_Patil.pdf" download class="btn btn-accent me-2 mx-1">Download Resume</a>
                </div>
            </div>
        </div>

        <div class="col-md-6 mt-3 mt-md-0">
            <div class="card-glass p-4">
                <form (ngSubmit)="send()">
                    <div class="mb-2">
                        <label class="form-label small text-muted-soft">Your name</label>
                        <input class="form-control bg-transparent text-white" [(ngModel)]="name" name="name" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label small text-muted-soft">Email</label>
                        <input class="form-control bg-transparent text-white" [(ngModel)]="email" name="email" />
                    </div>
                    <div class="mb-2">
                        <label class="form-label small text-muted-soft">Message</label>
                        <textarea class="form-control bg-transparent text-white" rows="4" [(ngModel)]="message"
                            name="message"></textarea>
                    </div>
                    <div class="text-end">
                        <button class="btn btn-accent" type="button" (click)="send()">Send</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
